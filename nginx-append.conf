
# ============================ HASTY TASTY API ========================================
server {
    listen 80;
    server_name api.hasty.restobuddy.in;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name api.hasty.restobuddy.in;

    ssl_certificate     /etc/letsencrypt/live/hasty.restobuddy.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hasty.restobuddy.in/privkey.pem;

    client_max_body_size 50m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        set $hasty_api http://hasty-tasty-api:8080;
        proxy_pass $hasty_api;
    }
}

